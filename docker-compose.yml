services:
  promenade-dev:
    build:
      context: .
      target: dev
    command: bash -lc "npm install && npm run dev:all"
    env_file:
      - .env
    ports:
      - "4321:4321"
      - "4173:4173"
      - "8787:8787"
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.constraint-label=traefik"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.promenade-studio-http.entrypoints=http"
      - "traefik.http.routers.promenade-studio-http.rule=Host(`${STUDIO_HOSTNAME:-studio-promenade.example.com}`)"
      - "traefik.http.routers.promenade-studio-http.middlewares=https-redirect@docker"
      - "traefik.http.routers.promenade-studio-http.service=promenade-studio-ui"
      - "traefik.http.routers.promenade-studio-https.entrypoints=https"
      - "traefik.http.routers.promenade-studio-https.rule=Host(`${STUDIO_HOSTNAME:-studio-promenade.example.com}`)"
      - "traefik.http.routers.promenade-studio-https.tls=true"
      - "traefik.http.routers.promenade-studio-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.promenade-studio-https.service=promenade-studio-ui"
      - "traefik.http.routers.promenade-studio-api-http.entrypoints=http"
      - "traefik.http.routers.promenade-studio-api-http.rule=Host(`${STUDIO_HOSTNAME:-studio-promenade.example.com}`) && (PathPrefix(`/api`) || PathPrefix(`/shows`) || PathPrefix(`/icons`))"
      - "traefik.http.routers.promenade-studio-api-http.middlewares=https-redirect@docker"
      - "traefik.http.routers.promenade-studio-api-http.service=promenade-studio-api"
      - "traefik.http.routers.promenade-studio-api-https.entrypoints=https"
      - "traefik.http.routers.promenade-studio-api-https.rule=Host(`${STUDIO_HOSTNAME:-studio-promenade.example.com}`) && (PathPrefix(`/api`) || PathPrefix(`/shows`) || PathPrefix(`/icons`))"
      - "traefik.http.routers.promenade-studio-api-https.priority=100"
      - "traefik.http.routers.promenade-studio-api-https.tls=true"
      - "traefik.http.routers.promenade-studio-api-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.promenade-studio-api-https.service=promenade-studio-api"
      - "traefik.http.services.promenade-studio-ui.loadbalancer.server.port=4173"
      - "traefik.http.services.promenade-studio-api.loadbalancer.server.port=8787"
    volumes:
      - .:/app
      - promenade_node_modules:/app/node_modules
  promenade-web:
    build:
      context: .
      target: static
      args:
        SHOW: ${SHOW:-demo-show}
        DEFAULT_LOCALE: ${DEFAULT_LOCALE:-de}
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://promenade.example.com}
        PUBLIC_ANALYTICS_PROVIDER: ${PUBLIC_ANALYTICS_PROVIDER:-none}
        PUBLIC_ANALYTICS_DOMAIN: ${PUBLIC_ANALYTICS_DOMAIN:-}
    restart: unless-stopped
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.constraint-label=traefik"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.promenade-http.entrypoints=http"
      - "traefik.http.routers.promenade-http.rule=Host(`${PUBLIC_HOSTNAME:-promenade.example.com}`)"
      - "traefik.http.routers.promenade-http.middlewares=https-redirect@docker"
      - "traefik.http.routers.promenade-http.service=promenade"
      - "traefik.http.routers.promenade-https.entrypoints=https"
      - "traefik.http.routers.promenade-https.rule=Host(`${PUBLIC_HOSTNAME:-promenade.example.com}`)"
      - "traefik.http.routers.promenade-https.tls=true"
      - "traefik.http.routers.promenade-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.promenade-https.service=promenade"
      - "traefik.http.services.promenade.loadbalancer.server.port=80"
      - "traefik.http.services.promenade.loadbalancer.healthcheck.path=/"
      - "traefik.http.services.promenade.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.promenade.loadbalancer.healthcheck.timeout=5s"

volumes:
  promenade_node_modules:

networks:
  traefik:
    external: true
