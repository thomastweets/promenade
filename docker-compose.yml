services:
  promenade:
    build:
      context: .
      target: stack-proxy
      args:
        SHOW: ${SHOW:-demo-show}
        DEFAULT_LOCALE: ${DEFAULT_LOCALE:-de}
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://promenade.example.com}
        PUBLIC_ANALYTICS_PROVIDER: ${PUBLIC_ANALYTICS_PROVIDER:-none}
        PUBLIC_ANALYTICS_DOMAIN: ${PUBLIC_ANALYTICS_DOMAIN:-}
    restart: unless-stopped
    env_file:
      - ./tmp/studio-auth.env
    depends_on:
      - studio-api
      - studio-ui
    ports:
      - "80:80"
    volumes:
      - public_dist:/srv/dist

  studio-api:
    build:
      context: .
      target: studio-api
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8787"
    volumes:
      - ./shows:/app/shows
      - ./public/shows:/app/public/shows
      - ./public/icons:/app/public/icons
      - ./tmp:/app/tmp
      - public_dist:/app/dist

  studio-ui:
    build:
      context: .
      target: studio-static
      args:
        STUDIO_BASE_PATH: ${STUDIO_BASE_PATH:-/studio/}
    restart: unless-stopped
    expose:
      - "80"

volumes:
  public_dist:
